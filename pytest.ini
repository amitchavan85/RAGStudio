[pytest]
testpaths = tests
pythonpath = . tests
# Test runs also write their INFO logs to a file (pytest's own handler; console stays clean).
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
